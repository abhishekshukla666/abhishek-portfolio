pillars:
  title: "Know yourself. Eat for it. Move with the year."
  items:
    - title: "Know your Prakriti"
      text: "A 24-question quiz built on Charaka's signs of each constitution (Vimanasthana 8). Your result shows how Vata, Pitta and Kapha combine in you, and what that tends to mean."
    - title: "Eat for it"
      text: "182 everyday Indian foods, each rated for your constitution and the season, with what goes well with it and what to avoid with it."
    - title: "Move with the year"
      text: "The six Ritus, the turns between them, and the vrat days, worked out from the sky where you are."

features:
  title: "What's inside"
  items:
    - title: "Today"
      text: "What suits this season, a verse for the day, and an idea for tonight's dinner in the evening."
    - title: "Foods"
      text: "Search 182 foods. Each has its taste, qualities and effect on each dosha, with its source."
    - title: "Plate Check"
      text: "Put a meal together and see what works, which foods clash (viruddha ahara), and a swap to try."
    - title: "Recipes"
      text: "30 simple recipes, from khichdi to kadhi, each with its source and a plate to check."
    - title: "Seasons"
      text: "Where you are in the six-season wheel, the Ritu Sandhi between seasons, and a guide to each one."
    - title: "Vrat days"
      text: "Ekadashi, Navratri and Chaturmas: what to eat and avoid, a day of meals, and parana times."
    - title: "Careful by default"
      text: "Tell Pathya about allergies, pregnancy, diabetes or medication, and it adjusts what it shows and holds back fasting plans."
    - title: "Gentle reminders"
      text: "Optional nudges for meals, the turn of a season and vrat days. Nothing else."
    - title: "English and हिन्दी"
      text: "The whole app in either language, with Sanskrit verses in Devanagari."

