faq:
  title: "Questions"
  items:
    - q: "Is this medical advice?"
      a: "No. Pathya shares what Ayurvedic texts and Indian traditions say about food, for learning and reflection. It isn't a medical device and doesn't replace a doctor. Please consult your doctor before fasting or changing your diet, especially if you are pregnant, have a health condition or take medication."
    - q: "Where does the content come from?"
      a: "From classical texts such as the Charaka Samhita and Ashtanga Hridaya, from dharmic customs and from folk sayings. Each tip is labelled with its source, and classical tips give the chapter and verse."
    - q: "What does it cost?"
      a: "Pathya is free, with no ads and no in-app purchases."
    - q: "Do I need an account?"
      a: "No. There's no sign-up, and everything you enter stays on your phone. You can delete it all from the Me screen."
    - q: "Why does it ask for my location?"
      a: "To work out sunrise, the tithi, the season and vrat timings where you are. It's used on your phone and never sent anywhere. Without it, Pathya uses Ujjain's calendar."
    - q: "Is there an Android version?"
      a: "Not yet. Pathya is for iPhone first; an Android version is planned."
