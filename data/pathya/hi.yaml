faq:
  title: "प्रश्न"
  items:
    - q: "क्या यह चिकित्सा सलाह है?"
      a: "नहीं। पथ्य बताता है कि आयुर्वेद ग्रंथ और भारतीय परंपराएँ आहार के बारे में क्या कहती हैं, समझने और विचार करने के लिए। यह कोई चिकित्सा उपकरण नहीं है और डॉक्टर की जगह नहीं लेता। उपवास या आहार बदलने से पहले अपने डॉक्टर से सलाह लें, ख़ासकर यदि आप गर्भवती हैं, कोई स्वास्थ्य समस्या है या दवा लेते हैं।"
    - q: "सामग्री कहाँ से आती है?"
      a: "चरक संहिता और अष्टांग हृदय जैसे शास्त्रीय ग्रंथों से, धार्मिक रीतियों से और लोक कहावतों से। हर सुझाव पर उसका स्रोत लिखा है, और शास्त्रीय सुझाव अध्याय और श्लोक भी बताते हैं।"
    - q: "इसकी क़ीमत क्या है?"
      a: "पथ्य निःशुल्क है, बिना विज्ञापन और बिना इन-ऐप ख़रीद के।"
    - q: "क्या खाता बनाना होगा?"
      a: "नहीं। कोई साइन-अप नहीं है, और आप जो भी लिखते हैं वह आपके फ़ोन पर ही रहता है। 'मैं' स्क्रीन से आप सब कुछ मिटा सकते हैं।"
    - q: "यह मेरा स्थान क्यों पूछता है?"
      a: "आपके स्थान पर सूर्योदय, तिथि, ऋतु और व्रत का समय निकालने के लिए। इसका उपयोग आपके फ़ोन पर ही होता है और यह कहीं भेजा नहीं जाता। इसके बिना पथ्य उज्जैन का पंचांग लेता है।"
    - q: "क्या Android संस्करण है?"
      a: "अभी नहीं। पथ्य पहले iPhone के लिए है; Android संस्करण की योजना है।"
