description: "पथ्य बताता है कि कौन-सा भोजन आपके शरीर और ऋतु के अनुकूल है, चरक संहिता और अन्य आयुर्वेद ग्रंथों से, हर सुझाव अपने स्रोत के साथ। हिन्दी और अंग्रेज़ी में।"

hero:
  over: "आयुर्वेदिक आहार मार्गदर्शिका"
  title: "अपने शरीर और ऋतु के अनुसार खाएँ।"
  lede: "पथ्य देखता है कि चरक संहिता और अन्य आयुर्वेद ग्रंथ भोजन के बारे में क्या कहते हैं, और बताता है कि आज आपके लिए क्या ठीक है: आपकी प्रकृति, ऋतु और आने वाले व्रतों के अनुसार। हर सुझाव बताता है कि वह कहाँ से आया है।"
  soon: "जल्द ही App Store पर"
  note: "iPhone के लिए, निःशुल्क। हिन्दी और अंग्रेज़ी में।"

pillars:
  title: "स्वयं को जानें। उसी अनुसार खाएँ। वर्ष के साथ चलें।"
  items:
    - title: "अपनी प्रकृति जानें"
      text: "चरक के बताए प्रकृति-लक्षणों (विमानस्थान 8) पर बनी 24 प्रश्नों की प्रश्नावली। परिणाम बताता है कि आपमें वात, पित्त और कफ कैसे मिले हैं, और इसका सामान्यतः क्या अर्थ है।"
    - title: "उसी अनुसार खाएँ"
      text: "रोज़ के 182 भारतीय खाद्य पदार्थ, हर एक आपकी प्रकृति और ऋतु के अनुसार आँका गया, साथ में यह भी कि किसके साथ अच्छा है और किसके साथ नहीं।"
    - title: "वर्ष के साथ चलें"
      text: "छह ऋतुएँ, उनके बीच की ऋतु-संधि, और व्रत के दिन, आपके स्थान के आकाश से निकाले गए।"

features:
  title: "ऐप में क्या है"
  items:
    - title: "आज"
      text: "इस ऋतु में क्या ठीक है, दिन का एक श्लोक, और शाम को रात के भोजन का एक सुझाव।"
    - title: "आहार"
      text: "182 खाद्य पदार्थ खोजें। हर एक का रस, गुण और हर दोष पर प्रभाव, स्रोत के साथ।"
    - title: "थाली जाँच"
      text: "भोजन की थाली बनाएँ और देखें कि क्या ठीक है, कौन-से पदार्थ आपस में विरुद्ध हैं, और क्या बदलकर देखें।"
    - title: "व्यंजन"
      text: "खिचड़ी से कढ़ी तक 30 सरल व्यंजन, हर एक अपने स्रोत और थाली जाँच के साथ।"
    - title: "ऋतुएँ"
      text: "छह ऋतुओं के चक्र में आप कहाँ हैं, ऋतुओं के बीच की ऋतु-संधि, और हर ऋतु की मार्गदर्शिका।"
    - title: "व्रत के दिन"
      text: "एकादशी, नवरात्रि और चातुर्मास: क्या खाएँ और क्या नहीं, दिन भर का भोजन, और पारण का समय।"
    - title: "सावधानी पहले से"
      text: "पथ्य को एलर्जी, गर्भावस्था, मधुमेह या दवा के बारे में बताएँ, और वह जो दिखाता है उसे बदल देता है और उपवास की योजना रोक लेता है।"
    - title: "हल्के अनुस्मारक"
      text: "भोजन, ऋतु बदलने और व्रत के दिनों के लिए, आपकी मर्ज़ी से। इससे अधिक कुछ नहीं।"
    - title: "हिन्दी और English"
      text: "पूरा ऐप किसी भी भाषा में, संस्कृत श्लोक देवनागरी में।"

sources:
  title: "ग्रंथों पर आधारित"
  text: "पथ्य का मार्गदर्शन शास्त्रीय आयुर्वेद ग्रंथों, धार्मिक रीतियों और लोक कहावतों से आता है। हर सुझाव पर चार में से एक लेबल होता है, और शास्त्रीय सुझाव ग्रंथ, अध्याय और श्लोक बताते हैं, ताकि आप शास्त्र और परंपरा का अंतर जान सकें।"
  labels: [शास्त्रीय, धार्मिक, लोक, आधुनिक]
  booksTitle: "इनसे लिया गया"
  books:
    - "चरक संहिता"
    - "अष्टांग हृदय"
    - "सुश्रुत संहिता"
    - "भावप्रकाश"
    - "क्षेमकुतूहल"
    - "भोजन कुतूहल"
    - "महीनों से जुड़ी लोक कहावतें"
    - "चातुर्मास, एकादशी और नवरात्रि की रीतियाँ"

