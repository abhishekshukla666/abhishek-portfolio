faq:
  title: "Questions"
  items:
    - q: "Is this a horoscope app?"
      a: "No. It is a calculation tool for Jyotish students and practitioners: it works out the chart and its tables, and labels each value. It does not show daily horoscopes, sun-sign readings or fortune telling, and it does not give medical, financial or legal advice."
    - q: "How are the positions calculated?"
      a: "With the Swiss Ephemeris, run entirely on your phone, using the Lahiri ayanamsa by default. You can change the ayanamsa in Settings."
    - q: "What if I don't know the birth time?"
      a: "Choose “Time unknown?” when entering the birth details, and the app makes an approximate chart."
    - q: "Does it share anything with Nitya Panchangam?"
      a: "Only if you turn it on in Settings. Then each profile's name, rashi and nakshatra are made available to Nitya Panchangam on the same phone, so it can mark good days for you. Nothing leaves the device."
    - q: "What does it cost?"
      a: "Nitya Kundli is free, with no ads. There are no in-app purchases in the current version."
    - q: "Is it on iPhone?"
      a: "Not yet. Nitya Kundli is on Google Play for Android now, and the iPhone version is coming soon to the App Store."
