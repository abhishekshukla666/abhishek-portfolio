pillars:
  title: "गणना का उपकरण, राशिफल नहीं।"
  items:
    - title: "पूरी कुंडली"
      text: "जन्म कुंडली और सभी सोलह वर्ग कुंडलियाँ, D1 से D60 तक, उत्तर, दक्षिण या पूर्व भारतीय शैली में।"
    - title: "दशा और गोचर"
      text: "विंशोत्तरी महादशा, अंतर्दशा और प्रत्यंतर दशा उनकी सटीक तिथियों के साथ, और किसी भी तिथि का गोचर, साढ़े साती सहित।"
    - title: "गुण मिलान"
      text: "दो कुंडलियों के बीच आठों कूट और मंगल दोष, हर एक के अर्थ के साथ।"

features:
  title: "ऐप में क्या है"
  items:
    - title: "ग्रह"
      text: "हर ग्रह की राशि, अंश, नक्षत्र और चरण, भाव और स्थिति, वक्री और अस्त होने के साथ।"
    - title: "बल"
      text: "षड्बल के छहों अंग, और अष्टकवर्ग की सारणियाँ।"
    - title: "भाव चलित और इंदु लग्न"
      text: "कौन-से ग्रह भाव बदलते हैं और क्यों, और धन का पारंपरिक लग्न, चरण-दर-चरण।"
    - title: "परिवार की कुंडलियाँ"
      text: "कुंडलियाँ स्वयं, परिवार, मित्र या ग्राहक के समूहों में सहेजें, हर एक का अपना रंग — या बिना सहेजे देखें।"
    - title: "जन्म समय नहीं पता?"
      text: "“समय पता नहीं?” चुनें और अनुमानित कुंडली देखें।"
    - title: "WhatsApp से पेस्ट करें"
      text: "जन्म विवरण सीधे संदेश से पेस्ट करें, छहों भाषाओं में।"
    - title: "विजेट"
      text: "आपका दिन, आज का तारा, अगला शुभ दिन और दशा, होम स्क्रीन और लॉक स्क्रीन पर।"
    - title: "PDF के रूप में भेजें"
      text: "कुंडली या मिलान PDF के रूप में भेजें, जब आप चाहें।"
    - title: "छह भाषाएँ"
      text: "पूरा ऐप हिन्दी, अंग्रेज़ी, गुजराती, कन्नड़, तेलुगु या मराठी में।"

