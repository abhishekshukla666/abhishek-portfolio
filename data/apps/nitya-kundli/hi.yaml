faq:
  title: "प्रश्न"
  items:
    - q: "क्या यह राशिफल का ऐप है?"
      a: "नहीं। यह ज्योतिष के विद्यार्थियों और जानकारों के लिए गणना का उपकरण है: यह कुंडली और उसकी सारणियाँ निकालता है, और हर मान को नाम देता है। यह दैनिक राशिफल, सूर्य-राशि फल या भविष्य कथन नहीं दिखाता, और न ही चिकित्सा, वित्तीय या क़ानूनी सलाह देता है।"
    - q: "ग्रहों की स्थिति कैसे निकाली जाती है?"
      a: "स्विस एफ़ेमेरिस से, पूरी तरह आपके फ़ोन पर, पहले से चुने लाहिड़ी अयनांश के साथ। अयनांश आप सेटिंग्स में बदल सकते हैं।"
    - q: "अगर जन्म समय पता न हो तो?"
      a: "जन्म विवरण भरते समय “समय पता नहीं?” चुनें, और ऐप अनुमानित कुंडली बनाता है।"
    - q: "क्या यह नित्य पंचांग के साथ कुछ साझा करता है?"
      a: "केवल तब, जब आप इसे सेटिंग्स में चालू करें। तब हर प्रोफ़ाइल का नाम, राशि और नक्षत्र उसी फ़ोन पर नित्य पंचांग को मिलते हैं, ताकि वह आपके लिए शुभ दिन चिह्नित कर सके। डिवाइस से कुछ बाहर नहीं जाता।"
    - q: "इसकी क़ीमत क्या है?"
      a: "नित्य कुंडली निःशुल्क है, बिना विज्ञापन के। वर्तमान संस्करण में कोई इन-ऐप ख़रीद नहीं है।"
    - q: "क्या यह iPhone पर है?"
      a: "अभी नहीं। नित्य कुंडली अभी Android के लिए Google Play पर है, और iPhone संस्करण जल्द ही App Store पर आ रहा है।"
