faq:
  title: "Questions"
  items:
    - q: "Why does it ask for my location?"
      a: "To work out sunrise, sunset and the timings that depend on them, for where you are. Your location is used only on your phone. If you decline, the app uses Ujjain and tells you so, and you can choose a city yourself."
    - q: "Why do some Ekadashis show two dates?"
      a: "The Smarta and Vaishnava traditions sometimes keep an Ekadashi a day apart. Both days are shown, each marked, with its own Paran time. Choose your tradition in Settings › Ekadashi tradition to see yours first."
    - q: "What does it cost?"
      a: "Nitya Panchangam is free, with no ads. There are no in-app purchases in the current version."
    - q: "Do I need an account?"
      a: "No. There is no sign-in and no server. Everything is calculated and kept on your device."
    - q: "Is this a horoscope or a prediction app?"
      a: "No. It is traditional calendar reckoning — tithi, nakshatra, muhurat and festivals. It does not make predictions, and it does not give medical, financial or legal advice."
    - q: "Where did the Kundli and Milan features go?"
      a: "Birth charts and Guna Milan now have their own app, Nitya Kundli, coming soon."
