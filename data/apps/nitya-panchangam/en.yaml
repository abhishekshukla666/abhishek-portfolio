pillars:
  title: "A panchang you can glance at, and trust."
  items:
    - title: "Worked out where you are"
      text: "Sunrise, sunset and every timing that depends on them are calculated on your phone for your location, with the Swiss Ephemeris. Without location, the app uses Ujjain, the traditional reference of the Hindu calendar, and says so."
    - title: "Festivals as the panchangs keep them"
      text: "Festivals and vrat days follow the published panchangs. When the Smarta and Vaishnava traditions keep an Ekadashi a day apart, both days are shown, each with its own Paran time."
    - title: "On your wrist and home screen"
      text: "Widgets that change at the moment a tithi or nakshatra ends, and an Apple Watch app with the day's muhurat on your watch face."

features:
  title: "What's inside"
  items:
    - title: "Today"
      text: "The tithi and when it ends, the paksha, month and samvat, what part of the day it is now, and the day's festivals."
    - title: "Panchang calendar"
      text: "A whole month at a glance, each day with its tithi, and every festival and vrat marked."
    - title: "Muhurat"
      text: "Good days for marriage, griha pravesh, buying a vehicle, naming and more. Choose your rashi to see which days suit you — no birth details needed."
    - title: "Festivals and vrat"
      text: "Everything coming up, from Ekadashi to Sankashti Chaturthi, with puja timings and a reminder for each."
    - title: "Notifications you choose"
      text: "The morning panchang, festivals, tithi, muhurat, chaughariya, hora and lagna — each one on or off."
    - title: "Widgets"
      text: "Home Screen and Lock Screen widgets that update at the exact moment a tithi, nakshatra or muhurat changes."
    - title: "Apple Watch"
      text: "Six screens — Today, Muhurat, Panchang, Now, Sun and Moon, Grahas — a muhurat complication, and a reminder before the next good muhurat."
    - title: "Six languages"
      text: "The whole app in Hindi, English, Gujarati, Kannada, Telugu or Marathi."
    - title: "A bell each morning"
      text: "A temple bell the first time you open the app each day, a conch on festival days — or silence, if you prefer."

