pillars:
  title: "एक नज़र में पंचांग, जिस पर भरोसा हो।"
  items:
    - title: "आपके स्थान के लिए गणना"
      text: "सूर्योदय, सूर्यास्त और उन पर टिका हर समय स्विस एफ़ेमेरिस से आपके फ़ोन पर, आपके स्थान के लिए निकाला जाता है। स्थान न हो तो ऐप हिन्दू कैलेंडर के पारंपरिक संदर्भ, उज्जैन, को लेता है और यह बताता भी है।"
    - title: "त्योहार, पंचांगों के अनुसार"
      text: "त्योहार और व्रत प्रकाशित पंचांगों के अनुसार हैं। जब स्मार्त और वैष्णव परंपराएँ कोई एकादशी एक दिन के अंतर से रखती हैं, तो दोनों दिन दिखते हैं, हर एक अपने पारण समय के साथ।"
    - title: "कलाई पर और होम स्क्रीन पर"
      text: "विजेट जो तिथि या नक्षत्र बदलते ही बदल जाते हैं, और Apple Watch ऐप जिसमें दिन का मुहूर्त वॉच फ़ेस पर रहता है।"

features:
  title: "ऐप में क्या है"
  items:
    - title: "आज"
      text: "तिथि और वह कब समाप्त होगी, पक्ष, मास और संवत्, अभी दिन का कौन-सा भाग है, और दिन के त्योहार।"
    - title: "पंचांग कैलेंडर"
      text: "एक नज़र में पूरा महीना, हर दिन अपनी तिथि के साथ, और हर त्योहार और व्रत चिह्नित।"
    - title: "मुहूर्त"
      text: "विवाह, गृह प्रवेश, वाहन ख़रीद, नामकरण और अन्य कामों के शुभ दिन। अपनी राशि चुनें और देखें कि कौन-से दिन आपके लिए शुभ हैं — जन्म विवरण की ज़रूरत नहीं।"
    - title: "त्योहार और व्रत"
      text: "आने वाला सब कुछ, एकादशी से संकष्टी चतुर्थी तक, पूजा के समय के साथ, और हर एक के लिए अनुस्मारक।"
    - title: "आपकी चुनी सूचनाएँ"
      text: "सुबह का पंचांग, त्योहार, तिथि, मुहूर्त, चौघड़िया, होरा और लग्न — हर एक अलग से चालू या बंद।"
    - title: "विजेट"
      text: "होम स्क्रीन और लॉक स्क्रीन विजेट, जो तिथि, नक्षत्र या मुहूर्त बदलने के ठीक उसी क्षण बदलते हैं।"
    - title: "Apple Watch"
      text: "छह स्क्रीन — आज, मुहूर्त, पंचांग, अभी, सूर्य और चंद्र, ग्रह — मुहूर्त कॉम्प्लिकेशन, और अगले शुभ मुहूर्त से पहले याद दिलाना।"
    - title: "छह भाषाएँ"
      text: "पूरा ऐप हिन्दी, अंग्रेज़ी, गुजराती, कन्नड़, तेलुगु या मराठी में।"
    - title: "हर सुबह घंटी"
      text: "हर दिन पहली बार ऐप खोलने पर मंदिर की घंटी, त्योहार के दिन शंख — या चाहें तो शांति।"

privacy:
  title: "आपके फ़ोन से कुछ बाहर नहीं जाता"
  items:
    - { title: "गणना आपके फ़ोन पर", text: "हर समय डिवाइस पर ही निकाला जाता है। कोई सर्वर नहीं है।" }
    - { title: "कोई खाता नहीं", text: "साइन-अप की ज़रूरत नहीं। ऐप खोलें और आज का पंचांग देखें।" }
    - { title: "कोई ट्रैकिंग नहीं", text: "न विज्ञापन, न किसी और कंपनी का एनालिटिक्स या ट्रैकिंग।" }
  link: "गोपनीयता नीति पढ़ें (अंग्रेज़ी में)"

faq:
  title: "प्रश्न"
  items:
    - q: "यह मेरा स्थान क्यों पूछता है?"
      a: "आपके स्थान के लिए सूर्योदय, सूर्यास्त और उन पर टिके समय निकालने के लिए। आपका स्थान केवल आपके फ़ोन पर उपयोग होता है। अनुमति न दें तो ऐप उज्जैन लेता है और यह बताता है, और आप स्वयं कोई शहर चुन सकते हैं।"
    - q: "कुछ एकादशियों की दो तिथियाँ क्यों दिखती हैं?"
      a: "स्मार्त और वैष्णव परंपराएँ कभी-कभी एकादशी एक दिन के अंतर से रखती हैं। दोनों दिन दिखते हैं, अलग-अलग चिह्नित, हर एक अपने पारण समय के साथ। अपनी परंपरा सेटिंग्स › एकादशी परंपरा में चुनें, तो आपका दिन पहले दिखेगा।"
    - q: "इसकी क़ीमत क्या है?"
      a: "नित्य पंचांग निःशुल्क है, बिना विज्ञापन के। वर्तमान संस्करण में कोई इन-ऐप ख़रीद नहीं है।"
    - q: "क्या खाता बनाना होगा?"
      a: "नहीं। न साइन-इन है, न सर्वर। सब कुछ आपके डिवाइस पर ही निकाला और रखा जाता है।"
    - q: "क्या यह राशिफल या भविष्यवाणी का ऐप है?"
      a: "नहीं। यह पारंपरिक पंचांग गणना है — तिथि, नक्षत्र, मुहूर्त और त्योहार। यह भविष्यवाणी नहीं करता, और न ही चिकित्सा, वित्तीय या क़ानूनी सलाह देता है।"
    - q: "कुंडली और मिलान की सुविधाएँ कहाँ गईं?"
      a: "जन्म कुंडली और गुण मिलान अब अपने अलग ऐप, नित्य कुंडली, में हैं, जो जल्द आ रहा है।"
