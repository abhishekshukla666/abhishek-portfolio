baseURL: "https://abhishekshukla.dev/"
locale: en-us
title: Abhishek Shukla
# No theme: every page is built from layouts/ in this repo. (themes/PaperMod is no longer used.)

menu:
  main:
    - { identifier: home, name: Home, url: /, weight: 10 }
    - { identifier: projects, name: Projects, url: /projects/, weight: 20 }
    - { identifier: experience, name: Experience, url: /experience/, weight: 30 }
    - { identifier: writing, name: Writing, url: /blog/, weight: 40 }
    - { identifier: notes, name: Notes, url: /notes/, weight: 50 }

params:
  description: "Abhishek Shukla — Senior iOS Engineer. Swift, SwiftUI and Swift Concurrency; apps on iPhone, Apple Watch and Android; articles on building iOS apps."
  env: production

taxonomies:
  tag: tags
  category: categories

outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
