{{- $p := hugo.Data.profile -}}
<footer class="footer">
  <div class="wrap">
    <div class="stack g4">
      <strong style="font-weight:600">{{ $p.name }}</strong>
      <span class="t-small">{{ $p.role }} · <a href="mailto:{{ $p.email }}" data-email="{{ $p.email }}">{{ $p.email }}</a></span>
    </div>
    <nav class="flinks" aria-label="Elsewhere">
      <a href="{{ $p.github }}" target="_blank" rel="me noopener">GitHub</a>
      <a href="{{ $p.linkedin }}" target="_blank" rel="me noopener">LinkedIn</a>
      <a href="mailto:{{ $p.email }}" data-email="{{ $p.email }}">Email</a>
      <a href="{{ "index.xml" | relURL }}">RSS</a>
    </nav>
  </div>
</footer>
