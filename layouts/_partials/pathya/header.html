{{- /* The top bar. Context: dict "page" "t". */ -}}
{{- $p := .page }}{{ $t := .t -}}
<header class="wrap top">
  <a class="brand" href="{{ $t.home | relURL }}"><img src="{{ "pathya/img/emblem.svg" | relURL }}" alt="" width="34" height="34">{{ if eq $t.lang "hi" }}पथ्य{{ else }}Pathya{{ end }}</a>
  <nav>
    {{- if $p.IsSection }}
    <a class="hide-sm" href="#features">{{ $t.nav.features }}</a>
    <a class="hide-sm" href="#sources">{{ $t.nav.sources }}</a>
    <a class="hide-sm" href="#faq">{{ $t.nav.faq }}</a>
    {{- end }}
    <a class="lang" href="{{ with $p.Params.otherUrl }}{{ . | relURL }}{{ else }}{{ $t.other.url | relURL }}{{ end }}" lang="{{ if eq $t.lang "en" }}hi{{ else }}en{{ end }}">{{ $t.other.label }}</a>
  </nav>
</header>
