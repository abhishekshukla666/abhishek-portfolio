{{- /* Pathya's <head>. Context: dict "page" "t" (the words for this language). */ -}}
{{- $p := .page }}{{ $t := .t -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if $p.IsSection }}{{ $t.title }}{{ else }}{{ $p.Title }} — {{ if eq $t.lang "hi" }}पथ्य{{ else }}Pathya{{ end }}{{ end }}</title>
<meta name="description" content="{{ with $p.Description }}{{ . }}{{ else }}{{ $t.description }}{{ end }}">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201A" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{ $p.Permalink }}">
{{- with $p.Params.otherUrl }}
<link rel="alternate" hreflang="{{ if eq $t.lang "en" }}hi{{ else }}en{{ end }}" href="{{ . | absURL }}">
{{- end }}
<meta property="og:title" content="{{ if $p.IsSection }}{{ $t.title }}{{ else }}{{ $p.Title }} — {{ if eq $t.lang "hi" }}पथ्य{{ else }}Pathya{{ end }}{{ end }}">
<meta property="og:description" content="{{ with $p.Description }}{{ . }}{{ else }}{{ $t.description }}{{ end }}">
<meta property="og:image" content="{{ "pathya/img/icon.png" | absURL }}">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="{{ "pathya/img/icon.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "pathya/img/apple-touch-icon.png" | relURL }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800{{ if eq $t.lang "hi" }}&family=Noto+Serif+Devanagari:wght@400;600{{ end }}&display=swap">
<link rel="stylesheet" href="{{ "pathya/pathya.css" | relURL }}">
